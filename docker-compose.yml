services:
  backend:
    build: ./backend
    container_name: autocare-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_PATH: /app/data/garage.db
    volumes:
      - autocare-data:/app/data   # SQLite file persists here
    networks:
      - autocare-net

  frontend:
    build: ./frontend
    container_name: autocare-frontend
    restart: unless-stopped
    ports:
      - "3000:80"               # Access at http://<your-proxmox-ip>:3000
    depends_on:
      - backend
    networks:
      - autocare-net

volumes:
  autocare-data:                  # Named volume — survives container restarts

networks:
  autocare-net:
    driver: bridge
