services:
  backend:
    build: ./backend
    container_name: autocare-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_PATH: /app/data/garage.db

      # AutoCare login
      # Change these values before deploying.
      AUTOCARE_USERNAME: admin
      AUTOCARE_PASSWORD: CHANGE-THIS-PASSWORD
      AUTOCARE_SESSION_DAYS: 30

    volumes:
      - autocare-data:/app/data
    networks:
      - autocare-net

  frontend:
    build: ./frontend
    container_name: autocare-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - autocare-net

volumes:
  autocare-data:

networks:
  autocare-net:
    driver: bridge
